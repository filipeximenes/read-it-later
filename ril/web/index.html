<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="theme-color-meta" content="#ffffff">
<title>Read It Later</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/reader.css">
<script>
  /* Apply the saved reading preferences before the first paint, so the page
     never flashes the wrong colours. `prefs.js` owns what the values mean and
     writes the ready-made CSS declarations here; this only replays them. */
  try {
    var saved = JSON.parse(localStorage.getItem('ril.reader') || '{}');
    var root = document.documentElement;
    if (saved.theme && saved.theme !== 'auto') root.setAttribute('data-theme', saved.theme);
    var css = saved.css || {};
    for (var key in css) root.style.setProperty(key, css[key]);
  } catch (e) { /* first visit, or storage is blocked */ }
</script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script type="module" src="/static/main.js"></script>
</head>
<body>
<div id="shell">

  <!-- ==================== Library ==================== -->
  <div id="library-pane">
    <header id="library-bar">
      <div class="bar-row">
        <span class="brand">ril</span>
        <span class="bar-spacer"></span>
        <button class="icon-btn" id="sync-btn" data-action="sync" aria-label="Sync now" hidden>
          <span class="sync-mark">↻</span>
        </button>
        <button class="icon-btn" data-action="add-url" aria-label="Add a URL">+</button>
        <div class="menu-wrap">
          <button class="icon-btn" id="library-menu-btn" data-action="library-menu"
                  aria-label="More actions" aria-haspopup="true" aria-expanded="false">⋯</button>
          <div class="menu" id="library-menu" role="menu">
            <button class="menu-item" role="menuitem" data-action="stats">📊 Statistics</button>
            <button class="menu-item" role="menuitem" data-action="typography">Aa Reading settings</button>
            <div class="menu-sep"></div>
            <button class="menu-item" role="menuitem" data-action="export">⬇ Export backup (.zip)</button>
            <button class="menu-item danger" role="menuitem" data-action="import">↺ Import backup…</button>
          </div>
        </div>
      </div>

      <div id="add-url-bar">
        <input type="url" id="add-url-input" placeholder="https://…" autocomplete="off">
        <button class="btn btn-primary" id="add-url-submit" data-action="add-url-submit">Save</button>
        <button class="btn" data-action="add-url-cancel">Cancel</button>
        <span id="add-url-error"></span>
      </div>

      <div id="search-row">
        <input type="search" id="search-input" placeholder="Search articles…" autocomplete="off">
      </div>

      <div id="tabbar" role="tablist" aria-label="Filter articles">
        <button class="tab" role="tab" data-filter="unread" aria-selected="true">
          Unread <span class="tab-count" id="count-unread"></span>
        </button>
        <button class="tab" role="tab" data-filter="all" aria-selected="false">
          All <span class="tab-count" id="count-all"></span>
        </button>
        <button class="tab" role="tab" data-filter="read" aria-selected="false">
          Read <span class="tab-count" id="count-read"></span>
        </button>
      </div>
    </header>

    <div id="library-scroll">
      <ul id="article-list"></ul>
      <div id="empty-msg" hidden></div>
    </div>
  </div>

  <!-- ==================== Reader ==================== -->
  <div id="reader-pane">
    <div id="reader-progress" aria-hidden="true"><div id="reader-progress-fill"></div></div>

    <div id="reader-scroll">
      <header id="reader-bar">
        <button class="icon-btn" data-action="back" aria-label="Back to the list">←</button>
        <div id="reader-bar-title"></div>
        <button class="icon-btn" data-action="typography" aria-label="Reading settings">Aa</button>
        <button class="icon-btn reader-only-wide" id="bar-read-btn" data-action="toggle-read"
                aria-label="Mark as read">✓</button>
        <div class="menu-wrap">
          <button class="icon-btn" id="reader-menu-btn" data-action="reader-menu"
                  aria-label="Article actions" aria-haspopup="true" aria-expanded="false">⋯</button>
          <div class="menu" id="reader-menu" role="menu">
            <button class="menu-item" role="menuitem" data-action="open-original">↗ Open the original</button>
            <button class="menu-item" role="menuitem" data-action="copy-link">⧉ Copy the link</button>
            <button class="menu-item" role="menuitem" data-action="refresh">↺ Re-fetch the article</button>
            <div class="menu-sep"></div>
            <button class="menu-item danger" role="menuitem" data-action="delete">× Delete</button>
          </div>
        </div>
      </header>

      <div id="placeholder">
        <span class="empty-mark">📖</span>
        <span>Pick an article to read</span>
      </div>

      <article id="article-view" hidden>
        <h1 id="article-title"></h1>
        <div id="article-meta"></div>
        <hr class="article-divider">
        <div id="article-body"></div>
        <section id="videos-section" hidden>
          <hr class="article-divider">
          <h3>Videos</h3>
          <div id="videos-container"></div>
        </section>
        <footer id="article-end">
          <div class="end-actions">
            <button class="btn btn-primary" id="end-read-btn" data-action="read-and-next"></button>
            <button class="btn" data-action="back">← Back to the list</button>
          </div>
          <div id="next-slot"></div>
        </footer>
      </article>
    </div>

    <nav id="reader-dock" aria-label="Article actions">
      <button class="btn" data-action="typography" aria-label="Reading settings">Aa</button>
      <button class="btn btn-primary dock-grow" id="dock-read" data-action="toggle-read"></button>
      <div class="menu-wrap">
        <button class="btn" id="dock-menu-btn" data-action="dock-menu"
                aria-label="Article actions" aria-haspopup="true" aria-expanded="false">⋯</button>
        <div class="menu menu-up" id="dock-menu" role="menu">
          <button class="menu-item" role="menuitem" data-action="open-original">↗ Open the original</button>
          <button class="menu-item" role="menuitem" data-action="copy-link">⧉ Copy the link</button>
          <button class="menu-item" role="menuitem" data-action="refresh">↺ Re-fetch the article</button>
          <div class="menu-sep"></div>
          <button class="menu-item danger" role="menuitem" data-action="delete">× Delete</button>
        </div>
      </div>
    </nav>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<input type="file" id="import-file" accept=".zip,application/zip" hidden>

<!-- ==================== Reading settings ==================== -->
<div id="type-overlay" class="overlay" data-close-overlay="type-overlay">
  <div class="sheet">
    <div class="sheet-header">
      <h2>Reading settings</h2>
      <button class="icon-btn" data-action="close-type" aria-label="Close">✕</button>
    </div>
    <div class="sheet-body">
      <div class="pref-row">
        <div class="pref-label"><span>Theme</span></div>
        <div class="seg" id="pref-theme">
          <button data-value="auto">Auto</button>
          <button data-value="light">Light</button>
          <button data-value="sepia">Sepia</button>
          <button data-value="dark">Dark</button>
        </div>
      </div>
      <div class="pref-row">
        <div class="pref-label"><span>Text size</span><span class="pref-value" id="pref-size-value"></span></div>
        <div class="stepper">
          <button class="step-btn small" data-action="size-down" aria-label="Smaller text">A</button>
          <div class="step-track"><span id="pref-size-track"></span></div>
          <button class="step-btn large" data-action="size-up" aria-label="Larger text">A</button>
        </div>
      </div>
      <div class="pref-row">
        <div class="pref-label"><span>Typeface</span></div>
        <div class="seg" id="pref-family">
          <button data-value="sans">Sans</button>
          <button data-value="serif" class="serif-sample">Serif</button>
        </div>
      </div>
      <div class="pref-row">
        <div class="pref-label"><span>Line spacing</span></div>
        <div class="seg" id="pref-leading">
          <button data-value="tight">Tight</button>
          <button data-value="normal">Normal</button>
          <button data-value="loose">Loose</button>
        </div>
      </div>
      <div class="pref-row">
        <div class="pref-label"><span>Line width</span></div>
        <div class="seg" id="pref-measure">
          <button data-value="narrow">Narrow</button>
          <button data-value="medium">Medium</button>
          <button data-value="wide">Wide</button>
        </div>
        <div class="pref-hint">
          Applies once the screen is wide enough to show it.
          <button id="pref-reset" data-action="reset-prefs">Reset everything</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ==================== Statistics ==================== -->
<div id="stats-overlay" class="overlay" data-close-overlay="stats-overlay">
  <div class="sheet full">
    <div class="sheet-header">
      <h2>Statistics</h2>
      <button class="icon-btn" data-action="close-stats" aria-label="Close">✕</button>
    </div>
    <div class="sheet-body" id="stats-content"></div>
  </div>
</div>

<!-- ==================== Import ==================== -->
<div id="import-overlay" class="overlay" data-close-overlay="import-overlay">
  <div class="sheet">
    <div class="sheet-header">
      <h2>Import backup</h2>
      <button class="icon-btn" data-action="close-import" aria-label="Close">✕</button>
    </div>
    <div class="sheet-body" id="import-content"></div>
    <div class="sheet-footer" id="import-footer"></div>
  </div>
</div>

</body>
</html>
