[project]
name = "read-it-later"
version = "0.1.0"
description = "A CLI tool to save, store and read articles later"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "markdownify>=1.2.2",
    "pydantic>=2.13.4",
    "python-slugify>=8.0.4",
    "rich>=15.0.0",
    "trafilatura>=2.0.0",
    "typer>=0.25.1",
    "browser-cookie3>=0.20.1",
    "uvicorn>=0.34.0",
]

[project.scripts]
ril = "ril.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The whole web UI is one embedded HTML/CSS/JS string constant, where a
# line-length limit means nothing.
"ril/server.py" = ["E501"]
